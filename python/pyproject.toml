[project]
name = "commerce-router"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Arun A", email = "arun@arun.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.6.3",
    "pydantic>=2.14.0",
    "typer>=0.27.3",
]

[project.scripts]
ask = "commerce_router.cli:app"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E, F: real errors (syntax, undefined names, unused imports)
# I: import order · UP: modern Python syntax · B: common bug patterns
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines: the formatter handles what it can

[tool.pytest.ini_options]
testpaths = ["tests"]